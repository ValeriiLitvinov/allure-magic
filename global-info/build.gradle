plugins {
    id 'java-library-distribution'
}

repositories {
    mavenCentral()
}

description = 'Allure Global Info Plugin'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    // keep in sync with the Allure distribution in allure/allure-<version>
    compileOnly 'io.qameta.allure:allure-plugin-api:2.21.0'
}

jar {
    archiveFileName = 'plugin.jar'
}
